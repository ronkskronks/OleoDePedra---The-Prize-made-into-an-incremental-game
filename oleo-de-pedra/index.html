<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <title>Óleo de Pedra</title>

</head>

      </main>
      <aside id="diario" class="quadro"></aside>
    </div>
  </div>

  <script>var JOGO = {};</script>

  <!-- DADOS: é aqui que o jogo é escrito. -->

  <script src="dados/recursos.js"></script>
  <script src="dados/acoes.js"></script>
  <script src="dados/construcoes.js"></script>
  <script src="dados/tecnologias.js"></script>
  <script src="dados/eventos.js"></script>
  <script src="dados/rivais.js"></script>
  <script src="dados/medidores.js"></script>

  <!-- MOTOR: faz as contas e desenha a tela. -->
  <script src="motor/validar.js"></script>
  <script src="motor/nucleo.js"></script>
  <script src="motor/tela.js"></script>
</body>
</html>
